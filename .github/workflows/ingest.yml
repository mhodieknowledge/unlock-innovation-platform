name: Ingestion

# The batch tier. OPPORTUNITY_INGESTION.md §1: "All stages run in the batch tier
# (GitHub Actions)." FREE_INFRASTRUCTURE.md §2 is why that is affordable — unlimited
# minutes on a public repository.
#
# §9's budget at 40 active sources on a 3-hourly cadence: ~320 fetches/day, ~60 new
# documents/day, ~245 LLM calls/day, ~8 Actions minutes/day. The schedules below sit
# inside that with room to spare, and each job's own cadence is per source
# (sources.cadence_minutes) rather than per workflow — so adding a slow source does
# not slow the fast ones.
#
# OUTSTANDING — SECURITY.md §8 wants actions pinned to commit SHAs. See ci.yml.

on:
  schedule:
    - cron: "40 */3 * * *"   # ingest: every three hours, §9's assumed cadence
    - cron: "20 */6 * * *"   # link health: §5.2 says every 6 hours
    - cron: "50 * * * *"     # re-verify: hourly, the per-record cadence does the rest
    - cron: "10 3 * * *"     # sweep and health: daily
    - cron: "30 3 * * *"     # embeddings, recommendations, project matches: daily, after the sweep
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        required: true
        default: ingest
        type: choice
        options: [ingest, fill-summaries, recategorise, links, reverify, sweep, health, check-sources, embed, recommend, match-projects, project-sweep]
      dry_run:
        description: Print what would be stored; write nothing to the database
        required: false
        default: false
        type: boolean
      no_ai:
        description: Force the NO_AI path, to prove the fallback still works
        required: false
        default: false
        type: boolean
      force:
        description: Ignore cadence and read every active source now
        required: false
        default: false
        type: boolean
      url:
        description: Put a single URL through the pipeline (needs dry_run; ignores the registry)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # One ingestion at a time. The pipeline is idempotent, so an overlap would be safe
  # rather than harmful — but two runs fetching the same hosts would break the
  # one-request-per-ten-seconds promise in §2.1 rule 4, which is not ours to break.
  group: ingest-${{ github.event.inputs.job || github.event.schedule }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GOOGLE_SAFE_BROWSING_API_KEY: ${{ secrets.GOOGLE_SAFE_BROWSING_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      OPERATOR_TELEGRAM_CHAT_ID: ${{ secrets.OPERATOR_TELEGRAM_CHAT_ID }}
      BRAND_NAME: ${{ vars.BRAND_NAME }}
      BRAND_DOMAIN: ${{ vars.BRAND_DOMAIN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The last-resort fetch path (scripts/lib/browser-fetch.mjs) needs a real Chromium.
      # Cached by Playwright version, so this is a download on the day the dependency
      # moves and a restore every other day.
      #
      # If this step is removed, the pipeline still runs: the fetcher reports the
      # sources it could not reach as `challenged` and carries on with the rest. That is
      # a worse run, not a broken one — but it is the run that produced 53 unusable
      # documents on 2026-09-15, so keep the step.
      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Guard against an unconfigured run
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not set. The job would silently do nothing."
            exit 1
          fi

      # The pipeline must keep working with every provider gone (AI_SYSTEM.md §13),
      # so an absent key is a WARNING here and not a failure. A run that produces
      # only JSON-LD records is a degraded run, not a broken one.
      - name: Report which providers are configured
        run: |
          for key in GROQ_API_KEY GEMINI_API_KEY CEREBRAS_API_KEY; do
            if [ -z "${!key}" ]; then
              echo "::warning::$key is not set — that provider is out of the chain."
            fi
          done

      - name: Ingest
        if: github.event.schedule == '40 */3 * * *'
        run: npm run ingest

      - name: Link health
        if: github.event.schedule == '20 */6 * * *'
        run: npm run reverify -- links

      - name: Re-verify and detect changes
        if: github.event.schedule == '50 * * * *'
        run: npm run reverify -- reverify

      - name: Sweep staleness and expiry, then check source health
        if: github.event.schedule == '10 3 * * *'
        run: |
          npm run reverify -- sweep
          npm run reverify -- health
          # An API source costs no model calls, so its records arrive with no description.
          # This is the smallest call in the system and it runs once a day against a budget
          # with sixty times the headroom it needs.
          npm run ingest -- --fill-summaries
          # Free: no fetch and no model, just the titles we already hold.
          npm run ingest -- --recategorise

      # AI_SYSTEM.md §3.3: the embedding model runs locally, with no API and no quota.
      # It is the decision that keeps the whole AI budget viable, and the model is cached
      # between runs by setup-node's npm cache plus the transformers cache below.
      - name: Cache the local embedding model
        if: github.event.schedule == '30 3 * * *' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: embedding-model-${{ hashFiles('package-lock.json') }}

      - name: Embed new records, then recompute recommendations and project matches
        if: github.event.schedule == '30 3 * * *'
        run: |
          npm run embed
          npm run recommend
          npm run match:projects
          npm run projects:sweep

      - name: Manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          JOB: ${{ github.event.inputs.job }}
          DRY: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          NOAI: ${{ github.event.inputs.no_ai == 'true' && '--no-ai' || '' }}
          FORCE: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
          URL: ${{ github.event.inputs.url }}
        run: |
          # A scheduled run reads only what cadence says is due, which is right for a
          # pipeline and wrong for checking a change: the registry's shortest cadence is
          # three hours, so a manual run minutes after a scheduled one finds nothing to
          # do and proves nothing. force and url are how an operator sees the fetch path
          # actually run. URL is quoted rather than word-split because a query string
          # contains characters the shell would otherwise take an interest in.
          case "$JOB" in
            ingest)
              if [ -n "$URL" ]; then
                # Quick-add cannot write (see scripts/ingest.mjs): force the dry flag on
                # rather than letting the run reach a constraint violation.
                npm run ingest -- --url "$URL" --dry-run $NOAI
              else
                npm run ingest -- $DRY $NOAI $FORCE
              fi
              ;;
            fill-summaries) npm run ingest -- --fill-summaries $DRY ;;
            recategorise)   npm run ingest -- --recategorise $DRY ;;
            check-sources) npm run sources:check ;;
            embed)         npm run embed -- $DRY ;;
            recommend)     npm run recommend -- $DRY ;;
            match-projects) npm run match:projects -- $DRY ;;
            project-sweep) npm run projects:sweep -- $DRY ;;
            # Named rather than wildcarded, because a wildcard sent `recategorise`
            # to reverify on run 42 and the dropdown looked correct the whole time.
            # A new option above that nobody wires up now says so.
            links|reverify|sweep|health) npm run reverify -- "$JOB" $DRY ;;
            *)
              echo "::error::No step is wired up for job '$JOB'. Add a branch here."
              exit 1
              ;;
          esac
