name: Deploy

# SYSTEM_ARCHITECTURE.md §19: migrations are versioned SQL applied in CI before
# deploy. That ordering matters — a Worker referring to a column that does not
# exist yet is a broken production, so the database moves first and the deploy
# is gated on it succeeding.
#
# Secrets required (repo Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL        migrations
#   CLOUDFLARE_API_TOKEN   deploy
#   CLOUDFLARE_ACCOUNT_ID  deploy
# Variables (Variables tab, not Secrets — these are not sensitive and
# NEXT_PUBLIC-equivalent values must be readable at build time):
#   SUPABASE_URL, SUPABASE_ANON_KEY
#
# And ONE of these, which is the address the Worker publishes to:
#   CUSTOM_DOMAIN           a zone in this Cloudflare account, e.g. mbele.africa (preferred)
#   WORKERS_DEV_SUBDOMAIN   an account-wide workers.dev name, registered automatically
#
# With neither, the deploy stops and says so: a Worker with no address is not deployable,
# and wrangler's own answer to that is an interactive prompt that cannot work in CI.
#
# The whole workflow no-ops with a clear message when the secrets are absent,
# so a fork or a fresh clone does not fail confusingly.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    name: Check deploy credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] \
             && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not set — skipping deploy. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable it."
          fi

  migrate:
    name: Apply migrations to Supabase
    needs: gate
    if: needs.gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Migrate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not set; refusing to deploy against an unmigrated database."
            exit 1
          fi
          npm run db:migrate

      # Reference data is idempotent (every seed is ON CONFLICT DO NOTHING), so
      # it is safe to re-run on every deploy and keeps a new environment correct
      # without a manual step.
      # AI_SYSTEM.md §12: changing a prompt "writes a row to the admin audit log".
      # Written on DEPLOY rather than on push, because the audit log is a record of what
      # is actually serving users, and a prompt that changed on a branch is not.
      - name: Record a prompt change in the admin audit log
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          SHA: ${{ github.sha }}
        run: |
          changed=$(git diff --name-only "${{ github.event.before || 'HEAD~1' }}" HEAD -- prompts/ 2>/dev/null || true)
          if [ -z "$changed" ]; then
            echo "No prompt changed in this deploy."
            exit 0
          fi
          echo "Prompt files changed: $changed"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO admin_audit_log (action, subject_type, after)
          VALUES ('prompt_version_deployed', 'prompt',
                  jsonb_build_object('commit', '$SHA',
                                     'files', '$(echo $changed | tr '\n' ' ')'));
          SQL

      - name: Seed reference data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run db:seed

  deploy:
    name: Build and deploy to Cloudflare
    needs: [gate, migrate]
    if: needs.gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build
        env:
          # Public values, inlined into the client bundle at build time.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          BRAND_DOMAIN: ${{ vars.BRAND_DOMAIN }}
        run: npm run build

      # Invariant 5 holds on the deploy path too, not only on PRs. A route that
      # went over budget must never reach production.
      - name: Byte budgets
        run: npm run budget

      # A Worker has to be reachable at SOME address, and Cloudflare offers two: a route on a
      # zone you own, or a workers.dev subdomain. `wrangler deploy` with neither prompts
      # interactively, and in CI a prompt is an exit code — which is exactly how the first
      # twenty-three deploys of this repository ended, after doing everything else correctly.
      #
      # So the address is decided here, once, in precedence order:
      #
      #   1. CUSTOM_DOMAIN            a zone in this Cloudflare account. Skips workers.dev.
      #   2. BRAND_DOMAIN             already configured for the brand, and almost always the
      #                               same domain. Placeholders are ignored.
      #   3. WORKERS_DEV_SUBDOMAIN    an explicit workers.dev name.
      #   4. the brand name itself    lower-cased, from packages/config/src/brand.mjs.
      #
      # Step 4 is why nothing has to be configured for this to deploy at all. The workers.dev name
      # is not a new decision — it is the brand name PRODUCT_SPEC.md §1 already keeps in exactly
      # one module, so a rebrand moves the address with it rather than leaving a stale word in a
      # workflow file. It is account-wide and permanent once registered; the variables above exist
      # so that can be overridden without touching code.
      - name: Decide the address
        id: address
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          BRAND_DOMAIN: ${{ vars.BRAND_DOMAIN }}
          WORKERS_DEV_SUBDOMAIN: ${{ vars.WORKERS_DEV_SUBDOMAIN }}
        run: |
          domain="$CUSTOM_DOMAIN"

          if [ -z "$domain" ] && [ -n "$BRAND_DOMAIN" ]; then
            case "$BRAND_DOMAIN" in
              *.invalid|example.*|localhost*) echo "BRAND_DOMAIN is a placeholder ($BRAND_DOMAIN); ignoring it." ;;
              *) domain="$BRAND_DOMAIN"; echo "Using BRAND_DOMAIN as the address." ;;
            esac
          fi

          subdomain=""
          if [ -z "$domain" ]; then
            subdomain="$WORKERS_DEV_SUBDOMAIN"
            if [ -z "$subdomain" ]; then
              # The brand name, from the one module that holds it. Lower-cased and stripped of
              # anything workers.dev will not take.
              subdomain=$(node --input-type=module -e \
                'import { BRAND } from "./packages/config/src/brand.mjs"; process.stdout.write(BRAND.name.toLowerCase().replace(/[^a-z0-9-]/g, ""))')
              echo "No address configured; using the brand name: $subdomain"
            fi
          fi

          if [ -z "$domain" ] && [ -z "$subdomain" ]; then
            echo "::error::No address to publish to, and the brand name resolved to nothing."
            exit 1
          fi

          echo "domain=$domain" >> "$GITHUB_OUTPUT"
          echo "subdomain=$subdomain" >> "$GITHUB_OUTPUT"

      - name: Register the workers.dev subdomain if it does not exist
        if: steps.address.outputs.domain == '' && steps.address.outputs.subdomain != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUBDOMAIN: ${{ steps.address.outputs.subdomain }}
        run: |
          set -o pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"

          # Already registered? Nothing to do — and re-PUTting a name is not something to do
          # casually, because the account keeps it.
          # A 404 here is the "none registered yet" answer rather than an error, which is why the
          # failure is swallowed instead of reported.
          current=$(curl -sS "$api" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import json,sys; b=json.load(sys.stdin); print((b.get('result') or {}).get('subdomain') or '')" 2>/dev/null || true)
          if [ -n "$current" ]; then
            echo "Already registered: $current"
            exit 0
          fi

          echo "Registering workers.dev subdomain: $SUBDOMAIN"
          response=$(curl -sS -X PUT "$api" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"subdomain\":\"$SUBDOMAIN\"}")

          # PARSED, not grepped. Cloudflare pretty-prints this response — `"success": true`, with a
          # space — so a grep for '"success":true' reported a registration that had just SUCCEEDED
          # as a failure, and the deploy stopped one step from the end. An assertion about JSON
          # belongs in a JSON parser.
          if printf '%s' "$response" | python3 -c "import json,sys; sys.exit(0 if json.load(sys.stdin).get('success') else 1)"; then
            echo "Registered."
          else
            echo "::error::Could not register \"$SUBDOMAIN\". Cloudflare said: $response"
            echo "::error::A name already taken by another account, or a token without Workers Scripts:Edit, both look like this. Set the WORKERS_DEV_SUBDOMAIN variable to try another name."
            exit 1
          fi

      # THE WORKER'S ENVIRONMENT IS NOT THE BUILD'S ENVIRONMENT, and the first live deployment of
      # this repository is what that sentence cost. The Build step above hands SUPABASE_URL to
      # `npm run build`, which is right for anything inlined at build time and does nothing at all
      # for a Worker serving a request an hour later: `wrangler deploy` uploads a bundle plus
      # whatever bindings its config declares, and this one declared BRAND_NAME and ENVIRONMENT.
      # So every page that reads the database got an unconfigured client in production and
      # nowhere else.
      #
      # Each key below is optional in the code (apps/web/src/lib/runtime.ts declares every one),
      # and an unset key is skipped rather than passed empty — a `--var SENTRY_DSN:` would make
      # `if (!dsn)` false and send envelopes nowhere.
      #
      # The split between the two lists is not a judgement call: `wrangler deploy` PRINTS the
      # value of every var it binds, into a log that is public on this repository. So a var is
      # here only if it is publishable. The anon key qualifies — it ships to browsers by design
      # and RLS is the boundary (SECURITY.md §2) — and the service-role key is in neither list,
      # because the request tier never gets it.
      - name: Configure the Worker's environment
        id: worker_env
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          TELEGRAM_BOT_HANDLE: ${{ vars.TELEGRAM_BOT_HANDLE }}
          QUERY_COMPILER_MODEL: ${{ vars.QUERY_COMPILER_MODEL }}
          QUERY_EMBEDDING_MODEL: ${{ vars.QUERY_EMBEDDING_MODEL }}
          PROJECT_EMBEDDING_MODEL: ${{ vars.PROJECT_EMBEDDING_MODEL }}
        run: |
          set -euo pipefail

          args=""
          configured=""
          missing=""
          for key in SUPABASE_URL SUPABASE_ANON_KEY TELEGRAM_BOT_HANDLE \
                     QUERY_COMPILER_MODEL QUERY_EMBEDDING_MODEL PROJECT_EMBEDDING_MODEL; do
            value="${!key}"
            if [ -n "$value" ]; then
              args="$args --var $key:$value"
              configured="$configured $key"
            else
              missing="$missing $key"
            fi
          done

          echo "Vars to bind:${configured:- none}"
          echo "Not configured:${missing:- none}"

          # The two the site cannot serve data without. A deploy that leaves them out produces a
          # site that answers 200 to every request and shows an error state on every page, which
          # is worse than a failed deploy because it looks like it worked.
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY are repository VARIABLES (Settings > Secrets and variables > Actions > Variables). Without them the Worker has no database and every page renders its error state."
            exit 1
          fi

          # Quoted on the way out: the value is a URL and a JWT, neither of which needs a shell.
          echo "vars=$args" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOMAIN: ${{ steps.address.outputs.domain }}
          VARS: ${{ steps.worker_env.outputs.vars }}
        working-directory: apps/web
        run: |
          set -o pipefail

          # Deliberately unquoted: $VARS is a list of `--var K:V` arguments, and quoting it would
          # hand wrangler one long argument instead of several.
          # shellcheck disable=SC2086
          if [ -n "$DOMAIN" ]; then
            # `--route` resolves the zone from the pattern, so the zone has to be in this account.
            # A domain whose DNS lives elsewhere fails here with Cloudflare saying so, which is
            # the right place to learn it.
            echo "Publishing to $DOMAIN"
            npx wrangler deploy --route "${DOMAIN}/*" $VARS 2>&1 | tee deploy.log
            echo "url=https://${DOMAIN}" >> "$GITHUB_OUTPUT"
          else
            npx wrangler deploy $VARS 2>&1 | tee deploy.log
            # The live URL from wrangler's own output rather than rebuilt from the worker name and
            # the subdomain — the two can disagree, and the log is the truth.
            url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi

      - name: Say where it is
        run: |
          url="${{ steps.deploy.outputs.url }}"
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Live at $url"

      # ASK A REAL PAGE FOR REAL HTML. This step used to ask `/api/health` alone, and
      # `/api/health` is the one route in the app that reads no configuration and touches no
      # database: it answered 200 through a deployment where the board, every country page and
      # every sitemap returned 500, and reported the deploy green. A liveness check that cannot
      # fail when the site is broken is not a check.
      #
      # So the gate is the board: status, the sentence the page exists to show, and the security
      # headers that only the SSR middleware can add. The first request after a deploy can land
      # on a cold or still-propagating Worker, hence the retries.
      - name: Smoke-test the deployment
        run: |
          # The URL the deploy actually reported, so a fresh environment needs no extra
          # variable to be smoke-tested. PRODUCTION_URL still wins when it is set, for the
          # case where the Worker sits behind something else.
          url="${{ vars.PRODUCTION_URL }}"
          if [ -z "$url" ]; then url="${{ steps.deploy.outputs.url }}"; fi
          if [ -z "$url" ]; then
            echo "::error::The deploy reported no URL, so nothing can be smoke-tested. A Worker nobody can reach is not a deployment."
            exit 1
          fi
          echo "Smoke-testing $url"

          for i in 1 2 3 4 5; do
            ok=true

            curl -fsS "$url/api/health" | grep -q '"status":"ok"' || ok=false

            # The board. 200 AND the copy, because a 200 carrying an error state is exactly the
            # failure this step exists to catch.
            body=$(curl -fsS -H 'accept: text/html' "$url/" || true)
            printf '%s' "$body" | grep -q 'Search opportunities' || ok=false
            # `if`, not `grep ... && ok=false`: GitHub runs these steps under `bash -e`, where a
            # `&&` whose left side fails ends the step. The copy is matched without its
            # apostrophe, which is a typographic one in the source and not a shell-safe byte.
            if printf '%s' "$body" | grep -qi 'load the board right now'; then ok=false; fi

            # Headers on an SSR response come from src/middleware.ts, not from public/_headers,
            # which Cloudflare applies to static assets only.
            curl -fsS -D - -o /dev/null "$url/" 2>/dev/null | grep -qi '^content-security-policy:' || ok=false

            # A prerendered page at the URL every link in the app uses: no trailing-slash hop.
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$url/privacy")" = "200" ] || ok=false

            if [ "$ok" = true ]; then
              echo "Smoke test passed: health, the board with its own copy, CSP on an SSR response, /privacy without a redirect."
              exit 0
            fi
            echo "Attempt $i did not pass; retrying in $((i * 4))s"
            sleep $((i * 4))
          done

          echo "::error::The deployment is reachable but not serving correctly. Run 'npm run verify:deployment -- $url' for the itemised list."
          exit 1
