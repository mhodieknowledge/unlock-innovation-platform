name: CI

# SYSTEM_ARCHITECTURE.md §19: migrations are applied in CI before deploy.
# SECURITY.md §12: CI runs dependency audit, secret scan, and the RLS suite.
#
# OUTSTANDING — SECURITY.md §8 requires "CI actions pinned to commit SHAs, not
# floating tags". The actions below use version tags because this session's
# GitHub access is scoped to this repository only, so the SHAs for actions/*
# could not be resolved. Guessing them would be worse than an honest tag: a
# wrong-but-plausible SHA fails opaquely. Pin these before the first production
# deploy.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build, byte budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # SECURITY.md §8: npm ci only, lockfile committed.
      - run: npm ci

      # AI_SYSTEM.md §12: "Prompts are versioned files in the repo. Changing one
      # requires the golden set to pass and writes a row to the admin audit log."
      #
      # The gate measures RECORDED model replies, which is what makes it deterministic
      # — and also means a prompt change alone would not move it. So a prompt change
      # that arrives without refreshed recordings is refused here, because otherwise
      # the gate would keep measuring the previous prompt's output and report a pass
      # that means nothing.
      - name: A prompt change must bring refreshed recordings
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          if echo "$changed" | grep -q '^prompts/'; then
            if ! echo "$changed" | grep -q '^eval/golden/'; then
              echo "::error::A prompt changed but the golden recordings did not."
              echo "The quality gate measures recorded model replies, so it cannot see a prompt"
              echo "change. Re-record before shipping it:"
              echo "  DATABASE_URL=... GROQ_API_KEY=... npm run golden:record"
              echo "  npm test    # then read the §12 metrics"
              exit 1
            fi
            echo "Prompt change with refreshed recordings — the gate below measures the new prompt."
          fi

      - name: Typecheck
        run: npm run typecheck

      # Phase 0 acceptance: "CI fails a deliberately oversized bundle."
      # This proves the gate itself works before trusting it on real output.
      - name: Byte-budget gate self-test
        run: npm run budget:selftest

      # Build BEFORE the tests. The on-demand byte-budget test measures the real
      # built client bundle, and it fails loudly rather than reporting 0 KB when
      # there is no build output — so the order here is load-bearing, not
      # cosmetic.
      - name: Build
        run: npm run build

      # One command, every suite: the eligibility golden corpus, the byte budgets for on-demand
      # routes, the axe audit over every public route, the WCAG contrast computation over every
      # token pair, and the copy review. DESIGN_SYSTEM.md §8 asks for accessibility "verified in
      # CI", and this is the line that does it.
      - name: Unit tests (golden corpus, byte budgets, axe, contrast, copy)
        run: npm test

      # Invariant 5. There is no override flag.
      - name: Byte budgets
        run: npm run budget

  migrations:
    name: Migrations forward and backward
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector-enabled image: DATA_MODEL.md requires the vector extension,
        # which the stock postgres image does not carry.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: mbele_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # No password in the URL. node-postgres and psql both fall back to PGPASSWORD,
      # which keeps this file free of anything shaped like a credential — and lets the
      # secret scanner cover this workflow instead of excluding it wholesale.
      DATABASE_URL: postgresql://postgres@localhost:5432/mbele_ci
      PGPASSWORD: ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Seed reference data
        run: npm run db:seed

      # Phase 0 acceptance: "All 54 African countries and the full category set
      # are in the database", and PRODUCT_SPEC.md §24 requires every
      # density-gated flag to ship disabled.
      - name: Assert seeded reference data
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE n int;
          BEGIN
            SELECT count(*) INTO n FROM countries WHERE is_african;
            IF n <> 54 THEN RAISE EXCEPTION 'expected 54 African countries, found %', n; END IF;

            SELECT count(*) INTO n FROM categories;
            IF n <> 21 THEN RAISE EXCEPTION 'expected 21 categories, found %', n; END IF;

            SELECT count(*) INTO n FROM regions;
            IF n < 8 THEN RAISE EXCEPTION 'expected at least 8 regions, found %', n; END IF;

            SELECT cardinality(member_countries) INTO n FROM regions WHERE code = 'africa_wide';
            IF n <> 54 THEN RAISE EXCEPTION 'africa_wide must expand to 54 countries, found %', n; END IF;

            SELECT count(*) INTO n FROM feature_flags WHERE enabled;
            IF n <> 0 THEN RAISE EXCEPTION 'density-gated flags must ship disabled, % enabled', n; END IF;

            SELECT count(*) INTO n FROM countries WHERE priority_tier = 1;
            IF n <> 6 THEN RAISE EXCEPTION 'expected 6 Tier-1 countries, found %', n; END IF;
          END $$;
          SQL

      # THE SEED RUNS ON EVERY DEPLOY, so "idempotent" is a claim the pipeline depends on
      # rather than a nicety. It was a comment: deploy.yml said "every seed is ON CONFLICT DO
      # NOTHING, so it is safe to re-run", and that clause only suppresses a conflict if some
      # constraint exists for it to conflict ON. `sources` had none, so eighteen deploys
      # re-seeded the 24 researched sources into 432 rows, and nothing anywhere noticed —
      # the assertion above counts countries, categories, regions and flags, which are exactly
      # the tables that DO have natural keys.
      #
      # So this counts every table in the schema, re-runs the whole seed, and counts again.
      # It is not a list that has to be kept up to date with the seeds, which is the point:
      # the seed that breaks this next will be one nobody thought to add here.
      - name: The seed must be idempotent
        run: |
          fingerprint() {
            psql "$DATABASE_URL" -tAc "
              SELECT string_agg(t || '=' || c, ' ' ORDER BY t)
                FROM (
                  SELECT table_name AS t,
                         (xpath('/row/cnt/text()',
                                query_to_xml(format('SELECT count(*) AS cnt FROM %I.%I', table_schema, table_name),
                                             false, true, '')))[1]::text::int AS c
                    FROM information_schema.tables
                   WHERE table_schema = 'public' AND table_type = 'BASE TABLE'
                ) x;"
          }
          before=$(fingerprint)
          npm run db:seed
          after=$(fingerprint)
          if [ "$before" != "$after" ]; then
            echo "::error::Re-running the seed changed the database. A seed that is not idempotent duplicates its rows on every deploy."
            diff <(printf '%s' "$before" | tr ' ' '\n') <(printf '%s' "$after" | tr ' ' '\n') || true
            exit 1
          fi
          echo "Re-running the whole seed changed nothing, across every table in the schema."

      # Proves the database REFUSES invariant violations (1, 2, 13), the ingestion
      # legal gates, and that owner-only tables grant no admin path. Shares one
      # script with local use so the two cannot drift.
      - name: Schema invariant tests
        run: npm run db:test

      # SYSTEM_ARCHITECTURE.md §7 specifies the engine once in TypeScript and
      # "mirrored as a Postgres function for batch use". Two implementations of
      # the product's spine can only be kept honest by a test: a divergence would
      # mean one verdict on the web and another in Telegram, which is exactly the
      # inconsistency that destroys trust in a verdict. So the whole golden corpus
      # runs through both.
      - name: Database-backed tests (engine parity, the ingestion pipeline)
        run: npm run test:db

      # "Backup restore tested and documented" is a Phase 3 acceptance criterion, and
      # the only way to keep it true is to test it on every push rather than nightly.
      # This runs against the CI database, which has CREATEDB — the production role
      # usually does not, which is why the nightly job restores into a local server.
      - name: Dump and prove the dump restores
        run: npm run backup -- restore-test

      - name: Roll back every migration
        run: npm run db:rollback -- --all

      - name: Assert a clean rollback
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE n int;
          BEGIN
            SELECT count(*) INTO n FROM pg_tables
             WHERE schemaname = 'public' AND tablename <> 'schema_migrations';
            IF n <> 0 THEN RAISE EXCEPTION 'rollback left % table(s) behind', n; END IF;
          END $$;
          SQL

      - name: Re-apply, to prove the round trip
        run: npm run db:migrate && npm run db:seed

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, so the scan sees what was committed rather than only
          # the tip. SECURITY.md §6: a committed secret is treated as
          # compromised regardless of how quickly it was removed.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # SECURITY.md §8: critical advisories patched within 72 hours.
      - name: Dependency audit
        run: npm audit --audit-level=high

      # Invariant 11: never commit a secret; this repository is public.
      # Shares one script with local use so the patterns cannot drift.
      - name: Secret scan
        run: scripts/secret-scan.sh
